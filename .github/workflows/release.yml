# Build cfd-ui for the three desktop platforms and attach the binaries to a
# GitHub Release. Fires on version tags (v*), or run it by hand from the
# Actions tab with a tag name — the release step then creates that tag at the
# built commit (useful because some clients cannot push tags directly).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cfd-sandbox-linux-x86_64
            bin: cfd-ui
          - os: windows-latest
            artifact: cfd-sandbox-windows-x86_64
            bin: cfd-ui.exe
          - os: macos-latest
            artifact: cfd-sandbox-macos-arm64
            bin: cfd-ui
          # Intel macOS is cross-compiled from the arm64 runner: macos-13
          # (the last Intel runner image) is retired and jobs queue forever.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cfd-sandbox-macos-x86_64
            bin: cfd-ui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries (eframe/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            cargo build --release -p cfd-ui --target "${{ matrix.target }}"
          else
            cargo build --release -p cfd-ui
          fi
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ -n "${{ matrix.target }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          else
            cp "target/release/${{ matrix.bin }}" dist/
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" "${{ matrix.bin }}"
          else
            zip "../${{ matrix.artifact }}.zip" "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: "*.zip"
          generate_release_notes: true
