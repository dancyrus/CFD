# Build cfd-ui for the two supported desktop targets and attach the binaries
# to a GitHub Release. Fires on version tags (v*), or run it by hand from the
# Actions tab with a tag name — the release step then creates that tag at the
# built commit (useful because some clients cannot push tags directly).
#
# Targets are deliberately just these two:
#   - Windows x86_64 (x86_64-pc-windows-msvc, the runner default toolchain)
#   - Apple Silicon macOS (aarch64-apple-darwin)
# Intel macOS cross-compilation and the Linux build were dropped on purpose;
# Linux users build from source (see README).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cfd-sandbox-windows-x86_64
            bin: cfd-ui.exe
          - os: macos-latest
            artifact: cfd-sandbox-macos-arm64
            bin: cfd-ui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cfd-ui
      # Apple Silicon REQUIRES a code signature (ad-hoc is enough) or the
      # binary is killed on launch. Dropping the Intel build does not remove
      # this requirement — keep the step.
      - name: Ad-hoc sign (Apple Silicon)
        if: runner.os == 'macOS'
        run: codesign --force -s - "target/release/${{ matrix.bin }}"
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.bin }}" dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" "${{ matrix.bin }}"
          else
            zip "../${{ matrix.artifact }}.zip" "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: "*.zip"
          generate_release_notes: true
