[package]
name = "cfd-ui"
version = "0.1.0"
edition = "2021"

# eframe/egui live HERE and nowhere else. Each worktree has its own empty
# target/ and eframe is a 2-5 minute cold build; keeping it in one crate means
# one session pays instead of four.
[dependencies]
cfd-contract = { workspace = true }
cfd-core = { workspace = true }
cfd-geom = { workspace = true }
# `persistence` carries the per-field colormap choice across restarts. It adds
# four transitive crates (ron, base64, enumn, home) and NO serde beyond what
# winit/wgpu already pull in. It also makes eframe persist window geometry,
# which is a wanted side effect, not an accident.
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true }
triple_buffer = { workspace = true }

[dev-dependencies]
cfd-results = { workspace = true }
